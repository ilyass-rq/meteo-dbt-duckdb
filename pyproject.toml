[project]
name = "meteo-dbt-duckdb"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ilyass rezzouqi", email = "rezzouqiilyass@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dbt-duckdb>=1.11.1",
    "requests>=2.34.2",
    "sqlfluff>=4.5.0",
    "sqlfluff-templater-dbt>=4.5.0",
]

[project.scripts]
meteo-dbt-duckdb = "meteo_dbt_duckdb:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
